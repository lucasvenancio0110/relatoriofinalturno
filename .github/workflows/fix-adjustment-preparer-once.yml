name: Fix adjustment preparer once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-adjustment-preparer-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Corrigir interpretação de nome do preparador
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          reasons = Path("src/js/operational-reasons.js")
          text = reasons.read_text(encoding="utf-8")

          anchor = '''const MAINTENANCE_RECORD_TYPES = new Set([\n  "maintenance",\n  "maintenance_prod",\n  "maintenance_completed",\n  "maintenance_monitoring",\n]);\n'''
          insert = '''const MAINTENANCE_RECORD_TYPES = new Set([\n  "maintenance",\n  "maintenance_prod",\n  "maintenance_completed",\n  "maintenance_monitoring",\n]);\n\n// No bloco de AJUSTES do grupo, o texto ao lado da TNL muitas vezes é apenas\n// o preparador responsável. Isso é metadado, não o motivo técnico do ajuste.\nconst ADJUSTMENT_PREPARER_NAMES = new Set(\n  [\n    "LUCAS",\n    "LUCAS V",\n    "LUCAS VENANCIO",\n    "NATTAN",\n    "CLAYTON",\n    "LUCIANO",\n    "MARLON",\n    "CHRISTOFFER",\n    "CHRISTOFER",\n    "MARCIO",\n    "JULIANO",\n    "EVERSON",\n    "EWERSON",\n    "WENDEL",\n    "ALAN",\n    "ADRIANO",\n    "GABRIEL",\n    "WILLIANS",\n  ].map((name) => normalizeHeader(name)),\n);\n\nfunction isAdjustmentPreparerLabel(value) {\n  let key = normalizeHeader(value);\n  if (!key) return false;\n  if (/^PREPARADOR(?:A)?\\s+/.test(key)) return true;\n  key = key.replace(/^(?:RESPONSAVEL|PREP)\\s+/, "").trim();\n  return ADJUSTMENT_PREPARER_NAMES.has(key);\n}\n\nexport function adjustmentReasonWithoutPreparer(value) {\n  const text = String(value || "").trim();\n  if (!text) return "";\n  if (isAdjustmentPreparerLabel(text)) return "";\n\n  // Ex.: "MÁRCIO - ferramenta quebrando" => "ferramenta quebrando".\n  // Ex.: "ferramenta quebrando - MÁRCIO" => "ferramenta quebrando".\n  const parts = text.split(/\\s*(?:[-–—|/]|•|:)\\s*/).filter(Boolean);\n  if (parts.length <= 1) return text;\n  return parts.filter((part) => !isAdjustmentPreparerLabel(part)).join(" - ").trim();\n}\n'''
          if "ADJUSTMENT_PREPARER_NAMES" not in text:
              if anchor not in text:
                  raise SystemExit("Âncora de operational-reasons não encontrada")
              text = text.replace(anchor, insert, 1)

          old = '''export function meaningfulOperationalReason(value, category) {\n  const text = String(value || "").trim();\n  if (!text) return "";\n  const key = normalizeHeader(text);\n  return GENERIC_REASONS[category]?.has(key) ? "" : text;\n}\n'''
          new = '''export function meaningfulOperationalReason(value, category) {\n  let text = String(value || "").trim();\n  if (!text) return "";\n  if (category === "adjustment") text = adjustmentReasonWithoutPreparer(text);\n  if (!text) return "";\n  const key = normalizeHeader(text);\n  return GENERIC_REASONS[category]?.has(key) ? "" : text;\n}\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "category === \"adjustment\"" not in text:
              raise SystemExit("Função meaningfulOperationalReason mudou inesperadamente")
          reasons.write_text(text, encoding="utf-8")

          tests = Path("tests/operational-reasons.test.js")
          t = tests.read_text(encoding="utf-8")
          t = t.replace(
              '  meaningfulOperationalReason,\n',
              '  meaningfulOperationalReason,\n  adjustmentReasonWithoutPreparer,\n',
              1,
          )
          if 'nome do preparador não conta como motivo de ajuste' not in t:
              t += '''\n\ntest("nome do preparador não conta como motivo de ajuste", () => {\n  [\n    "Márcio",\n    "Wendel",\n    "Luciano",\n    "Nattan",\n    "Clayton",\n    "Christoffer",\n    "Marlon",\n    "Everson",\n    "Ewerson",\n    "Adriano",\n    "Gabriel",\n    "Willians",\n    "Alan",\n    "Lucas V",\n    "Preparador João",\n  ].forEach((name) => assert.equal(meaningfulOperationalReason(name, "adjustment"), ""));\n});\n\ntest("nome do preparador é removido quando existe motivo técnico junto", () => {\n  assert.equal(adjustmentReasonWithoutPreparer("Márcio - Correção de medida"), "Correção de medida");\n  assert.equal(adjustmentReasonWithoutPreparer("Ferramenta quebrando - Wendel"), "Ferramenta quebrando");\n  assert.equal(meaningfulOperationalReason("Luciano / Ajuste no diâmetro", "adjustment"), "Ajuste no diâmetro");\n});\n\ntest("registro de ajuste contendo somente preparador obriga novo motivo", () => {\n  const state = createEmptyState();\n  record(state, 60, "adjustment", "Márcio");\n  assert.equal(existingAdjustmentReason(state, 60), "");\n});\n'''
          tests.write_text(t, encoding="utf-8")

          # Troca a URL dos assets para o Safari baixar o bundle novo imediatamente.
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = re.sub(r'1\\.8\\.1-20260815-1203', '1.8.3-20260815-1332', html)
          index.write_text(html, encoding="utf-8")
          PY

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar aplicação
        run: npm run validate

      - name: Commitar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-adjustment-preparer-once.yml
          git add -A
          git commit -m "fix: do not treat preparer names as adjustment reasons"
          git push
