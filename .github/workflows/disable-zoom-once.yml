name: Disable zoom once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/disable-zoom-once.yml

permissions:
  contents: write

jobs:
  apply:
    name: Bloquear zoom do app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar bloqueio de zoom
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />'
          new = '<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />'
          if old not in index and new not in index:
              raise SystemExit('Meta viewport esperada não encontrada')
          index = index.replace(old, new)
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('styles/base.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'html {\n  min-height: 100%;'
          replacement = 'html {\n  min-height: 100%;\n  touch-action: pan-x pan-y;'
          if 'touch-action: pan-x pan-y;' not in css:
              if marker not in css:
                  raise SystemExit('Bloco html esperado não encontrado')
              css = css.replace(marker, replacement, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar aplicação
        run: npm test

      - name: Commit da alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles/base.css
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "feat: disable app zoom"
          git push
