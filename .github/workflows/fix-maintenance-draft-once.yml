name: Fix maintenance draft once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-maintenance-draft-once.yml

permissions:
  contents: write

jobs:
  fix:
    name: Corrigir rascunho de manutenção
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correção
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/js/app.js")
          source = path.read_text(encoding="utf-8")
          needle = '  )[0] || "";\n}\n\nfunction showMaintenanceForm'
          replacement = '  )[0] || "";\n  saveSession();\n}\n\nfunction showMaintenanceForm'

          if replacement in source:
              print("Correção já estava aplicada.")
          else:
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f"Esperava 1 ponto de correção, encontrei {count}.")
              path.write_text(source.replace(needle, replacement, 1), encoding="utf-8")
              print("Correção aplicada: remoção do rascunho agora é persistida no localStorage.")

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar aplicação
        run: npm run validate

      - name: Confirmar regressão corrigida
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/js/app.js").read_text(encoding="utf-8")
          expected = 'activeMaintenanceDraftKey = Object.keys(maintenanceDrafts)'
          if expected not in source:
              raise SystemExit("Função de limpeza de rascunho não encontrada.")
          segment = source[source.index("function clearMaintenanceDraft"):source.index("function showMaintenanceForm")]
          if "saveSession();" not in segment:
              raise SystemExit("A limpeza do rascunho ainda não persiste a sessão.")
          print("Regressão validada: clearMaintenanceDraft persiste a sessão.")

      - name: Commit da correção
        run: |
          if git diff --quiet -- src/js/app.js; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/app.js
          git commit -m "fix: stop reopening saved maintenance card"
          git push origin HEAD:main
