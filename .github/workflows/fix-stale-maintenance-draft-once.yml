name: Fix stale maintenance draft once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-stale-maintenance-draft-once.yml

permissions:
  contents: write

jobs:
  fix:
    name: Corrigir rascunho antigo de manutenção
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correção
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/js/app.js")
          source = path.read_text(encoding="utf-8")
          needle = '''  if (!draft || !context || !tnl) return;
  maintenanceResumeStarted = true;
'''
          replacement = '''  if (!draft || !context || !tnl) return;
  const savedCase = maintenanceCaseOf(state, tnl);
  const draftUpdatedAt = Date.parse(draft.updatedAt || "");
  const caseUpdatedAt = Date.parse(savedCase?.updatedAt || "");
  if (
    savedCase?.reviewed &&
    Number.isFinite(caseUpdatedAt) &&
    (!Number.isFinite(draftUpdatedAt) || draftUpdatedAt <= caseUpdatedAt)
  ) {
    clearMaintenanceDraft(activeMaintenanceDraftKey);
    return;
  }
  maintenanceResumeStarted = true;
'''

          if replacement in source:
              print("Correção já estava aplicada.")
          else:
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f"Esperava 1 ponto de correção, encontrei {count}.")
              path.write_text(source.replace(needle, replacement, 1), encoding="utf-8")
              print("Correção aplicada: rascunhos antigos já concluídos serão descartados na restauração.")

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar aplicação
        run: npm run validate

      - name: Confirmar regressão corrigida
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/js/app.js").read_text(encoding="utf-8")
          start = source.index("async function resumePendingMaintenanceDraft")
          end = source.index("async function chooseMaintenance", start)
          segment = source[start:end]
          required = [
              "const savedCase = maintenanceCaseOf(state, tnl);",
              "draftUpdatedAt <= caseUpdatedAt",
              "clearMaintenanceDraft(activeMaintenanceDraftKey);",
          ]
          missing = [item for item in required if item not in segment]
          if missing:
              raise SystemExit(f"Proteções ausentes: {missing}")
          print("Regressão validada: rascunho salvo antigo não será reaberto.")

      - name: Commit da correção
        run: |
          if git diff --quiet -- src/js/app.js; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/app.js
          git commit -m "fix: discard stale saved maintenance drafts"
          git push origin HEAD:main
