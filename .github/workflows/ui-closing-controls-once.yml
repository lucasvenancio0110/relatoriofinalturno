              index = index.replace(old_html, new_html, 1)
              index_path.write_text(index, encoding='utf-8')

          app_path = Path('src/js/app.js')
          app = app_path.read_text(encoding='utf-8')

          old_apply = '''function applyFields(fields = {}) {
