          marker = '/* closing-controls-v1 */'
          block = r'''

/* closing-controls-v1 */
.closing-layout {
  display: grid;
  gap: 13px;
}

.shift-card-group {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.closing-card {
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: color-mix(in srgb, var(--surface-strong) 82%, transparent);
  transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
}

.closing-card-label {
  display: block;
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 900;
  letter-spacing: 0.02em;
}

.shift-segment {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-top: 10px;
}

.shift-option {
  min-width: 0;
  min-height: 50px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 1px;
  padding: 4px 2px;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--muted);
  background: color-mix(in srgb, var(--surface-soft) 90%, transparent);
  transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
}

.shift-option strong {
  font-size: 1rem;
  line-height: 1;
}

.shift-option small {
  font-size: 0.52rem;
  font-weight: 900;
  letter-spacing: 0.06em;
}

.shift-option.selected {
  border-color: color-mix(in srgb, var(--accent) 74%, white 8%);
  color: #fff;
  background: linear-gradient(145deg, var(--accent), var(--accent-strong));
  box-shadow: 0 7px 18px rgba(42, 161, 152, 0.2);
}

.shift-option:active:not(:disabled),
.counter-btn:active:not(:disabled) {
  transform: scale(0.94);
}

.shift-option:disabled {
  opacity: 0.25;
  cursor: not-allowed;
}

.counter-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
}

.counter-card {
  min-height: 104px;
  display: grid;
  align-content: space-between;
}

.counter-card.has-value {
  border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
  background: color-mix(in srgb, var(--accent) 8%, var(--surface-strong));
}

.counter-stepper {
  display: grid;
  grid-template-columns: 40px minmax(40px, 1fr) 40px;
  align-items: center;
  gap: 5px;
  margin-top: 11px;
}

.counter-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--text);
  background: var(--surface-soft);
  font-size: 1.35rem;
  font-weight: 850;
  line-height: 1;
  transition: transform 0.14s ease, filter 0.14s ease, opacity 0.14s ease;
}

.counter-plus {
  border-color: color-mix(in srgb, var(--accent) 54%, var(--line));
  color: #fff;
  background: color-mix(in srgb, var(--accent) 76%, var(--surface-strong));
}

.counter-btn:disabled {
  opacity: 0.28;
  cursor: not-allowed;
}

.counter-value {
  min-width: 0;
  color: var(--text);
  text-align: center;
  font-size: 1.28rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

@media (max-width: 680px) {
  .details-body.closing-layout {
    padding: 0 12px 14px;
  }

  .shift-card-group {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .closing-card {
    padding: 11px;
    border-radius: 14px;
  }

  .shift-card {
    padding-bottom: 10px;
  }

  .shift-segment {
    margin-top: 8px;
  }

  .shift-option {
    min-height: 44px;
  }

  .counter-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .counter-card {
    min-height: 96px;
  }

  .counter-stepper {
    grid-template-columns: 36px minmax(36px, 1fr) 36px;
    gap: 3px;
    margin-top: 8px;
  }

  .counter-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 1.2rem;
  }

  .counter-value {
    font-size: 1.16rem;
  }

  .closing-card-label {
    font-size: 0.7rem;
  }
}
'''
          if marker not in css:
              css_path.write_text(css.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar aplicação
        run: npm run validate

      - name: Validar controles novos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('src/js/app.js').read_text(encoding='utf-8')
          css = Path('styles/components.css').read_text(encoding='utf-8')
          required = [
              'data-shift-picker="currentShift"',
              'data-shift-picker="nextShift"',
              'data-counter-target="checkpoint"',
              'data-counter-target="selTnc"',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Controles ausentes no HTML: {missing}')
          for item in ['renderShiftControls', 'adjustClosingCounter', 'CLOSING_COUNTER_IDS']:
              if item not in js:
                  raise SystemExit(f'Comportamento ausente no JS: {item}')
          if 'closing-controls-v1' not in css:
              raise SystemExit('Estilos dos novos controles ausentes')
          print('Interface de fechamento validada.')
          PY

      - name: Commit da alteração
        run: |
          if git diff --quiet -- index.html src/js/app.js styles/components.css; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/js/app.js styles/components.css
          git commit -m "feat: compact closing cards and direct shift controls"
          git push origin HEAD:main
