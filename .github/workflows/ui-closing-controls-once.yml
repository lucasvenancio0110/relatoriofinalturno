name: Apply compact closing controls UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-closing-controls-once.yml

permissions:
  contents: write

jobs:
  apply:
    name: Atualizar cards e controles do fechamento
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar interface compacta
        run: python scripts/ui_closing_patch_once.py

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar aplicação
        run: npm run validate

      - name: Commit da alteração
        run: |
          if git diff --quiet -- index.html src/js/app.js styles/components.css; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/js/app.js styles/components.css
          git commit -m "feat: compact closing cards and direct shift controls"
          git push origin HEAD:main
