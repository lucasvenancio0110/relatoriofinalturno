name: Finalize operational reasons once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-operational-reasons-once.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Finalizar regra de motivos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ajustar código e reforçar testes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/js/app.js')
          app = app_path.read_text(encoding='utf-8')

          old_residual = '''    const keepsCategory = residual === "keep" || ["maintenance_after", "maintenance_only"].includes(residual);
          if (keepsCategory && ["adjustment", "maintenance"].includes(category)) {
            const keptReason = await ensureExistingCategoryReason(tnl, category);
            if (!keptReason) {
              restoreSnapshot(state, before);
              renderAll();
              return false;
            }
          }
          if (residual === "remove") removeCategory(state, tnl, category);
          if (residual === "future_after" || residual === "future_only") {'''
          new_residual = '''    const keepsCategory =
              residual === "keep" || ["maintenance_after", "maintenance_only"].includes(residual);
            if (keepsCategory && ["adjustment", "maintenance"].includes(category)) {
              const keptReason = await ensureExistingCategoryReason(tnl, category);
              if (!keptReason) {
                restoreSnapshot(state, before);
                renderAll();
                return false;
              }
            }
            if (residual === "remove") removeCategory(state, tnl, category);
            if (residual === "future_after" || residual === "future_only") {'''
          old_residual = "\n".join(line[10:] if line.startswith("          ") else line for line in old_residual.splitlines())
          new_residual = "\n".join(line[10:] if line.startswith("          ") else line for line in new_residual.splitlines())
          if old_residual in app:
            app = app.replace(old_residual, new_residual, 1)

          old_release = '''    if (!answer) return false;
          if (category === "adjustment" && answer === "no") {
            const adjustmentReason = await ensureExistingCategoryReason(tnl, "adjustment");
            if (!adjustmentReason) return false;
          }
          categoryAnswers[category] = answer === "yes";'''
          new_release = '''    if (!answer) return false;
            if (category === "adjustment" && answer === "no") {
              const adjustmentReason = await ensureExistingCategoryReason(tnl, "adjustment");
              if (!adjustmentReason) return false;
            }
            categoryAnswers[category] = answer === "yes";'''
          old_release = "\n".join(line[10:] if line.startswith("          ") else line for line in old_release.splitlines())
          new_release = "\n".join(line[10:] if line.startswith("          ") else line for line in new_release.splitlines())
          if old_release in app:
            app = app.replace(old_release, new_release, 1)

          app_path.write_text(app, encoding='utf-8')

          test_path = Path('tests/operational-reasons.test.js')
          tests = test_path.read_text(encoding='utf-8')
          if 'readFileSync' not in tests:
            tests = tests.replace(
              'import assert from "node:assert/strict";\n',
              'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n',
              1,
            )
          if 'const appSource =' not in tests:
            marker = 'import { ensureMaintenanceCase } from "../src/js/maintenance.js";\n'
            tests = tests.replace(
              marker,
              marker + '\nconst appSource = readFileSync(new URL("../src/js/app.js", import.meta.url), "utf8");\n',
              1,
            )
          wiring_test = '''
          test("ronda conecta a regra de motivo a todas as transições críticas", () => {
            assert.match(appSource, /const savedReason = existingAdjustmentReason\(state, tnl\)/);
            assert.match(appSource, /const initial = providedReason \|\| existingMaintenanceReason\(state, tnl\)/);
            assert.match(appSource, /const initialReason = existingMaintenanceReason\(state, tnl\)/);
            assert.match(appSource, /category === "adjustment" && answer === "no"/);
            assert.match(appSource, /keepsCategory && \["adjustment", "maintenance"\]\.includes\(category\)/);
          });
          '''
          wiring_test = "\n".join(line[10:] if line.startswith("          ") else line for line in wiring_test.splitlines())
          if 'ronda conecta a regra de motivo a todas as transições críticas' not in tests:
            tests = tests.rstrip() + '\n' + wiring_test + '\n'
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar suíte completa
        run: npm test

      - name: Remover workflows temporários e publicar ajuste final
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/enforce-operational-reasons-once.yml
          git rm -f .github/workflows/enforce-operational-reasons-v2-once.yml
          git rm -f .github/workflows/finalize-operational-reasons-once.yml
          git add src/js/app.js tests/operational-reasons.test.js
          git commit -m "chore: finalize operational reason enforcement"
          git push
