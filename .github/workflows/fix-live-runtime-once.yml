name: Fix live runtime once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-live-runtime-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correções no repositório correto
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = "1.8.1"
          cache = "1.8.1-20260815-1203"

          config = Path("src/js/config.js")
          text = config.read_text(encoding="utf-8")
          text = re.sub(r'export const APP_VERSION = "[^"]+";', f'export const APP_VERSION = "{version}";', text, count=1)
          config.write_text(text, encoding="utf-8")

          # Safari/iPhone amplia automaticamente campos menores que 16px.
          responsive = Path("styles/responsive.css")
          css = responsive.read_text(encoding="utf-8")
          marker = "/* iOS anti-focus-zoom: campos editáveis nunca abaixo de 16px */"
          if marker not in css:
              css += f'''\n\n{marker}\n@media (max-width: 920px) {{\n  input:not([type="hidden"]),\n  textarea,\n  select {{\n    font-size: 16px !important;\n    touch-action: manipulation;\n  }}\n\n  button,\n  .modal-btn {{\n    touch-action: manipulation;\n  }}\n}}\n'''
          responsive.write_text(css, encoding="utf-8")

          # Mantém pinça/gesture bloqueados, mas não cancela touchend global (preserva 1 toque nos campos).
          Path("src/js/zoom-lock.js").write_text('''const preventZoom = (event) => {\n  event.preventDefault();\n};\n\n["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {\n  document.addEventListener(eventName, preventZoom, { passive: false });\n});\n\ndocument.addEventListener(\n  "touchmove",\n  (event) => {\n    if (event.touches && event.touches.length > 1) preventZoom(event);\n  },\n  { passive: false },\n);\n\ndocument.addEventListener("dblclick", preventZoom, { passive: false });\n''', encoding="utf-8")

          # O build antigo NÃO copiava zoom-lock.js para dist. Isso fazia a trava existir no repo e faltar no site publicado.
          build = Path("scripts/build.mjs")
          build_text = build.read_text(encoding="utf-8")
          copy_anchor = 'cp(resolve(root, ".nojekyll"), resolve(output, ".nojekyll")),'
          copy_zoom = 'cp(resolve(root, "src/js/zoom-lock.js"), resolve(output, "src/js/zoom-lock.js")),'
          if copy_zoom not in build_text:
              if copy_anchor not in build_text:
                  raise SystemExit("Âncora do build não encontrada")
              build_text = build_text.replace(copy_anchor, copy_anchor + "\n  " + copy_zoom, 1)
          build.write_text(build_text, encoding="utf-8")

          # Cache-bust: força o iPhone a baixar a lógica atual (inclusive a regra de motivo).
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          assets = [
              "./styles/tokens.css",
              "./styles/base.css",
              "./styles/components.css",
              "./styles/responsive.css",
              "./src/js/zoom-lock.js",
              "./src/js/app.js",
          ]
          for asset in assets:
              html = re.sub(re.escape(asset) + r'(?:\?v=[^\"\']+)?', f"{asset}?v={cache}", html)
          index.write_text(html, encoding="utf-8")

          # Validador precisa entender URLs versionadas e checar o arquivo real sem query string.
          validate = Path("scripts/validate.mjs")
          val = validate.read_text(encoding="utf-8")
          val = val.replace(
              'if (!/<script\\s+type="module"\\s+src="\\.\\/src\\/js\\/app\\.js"><\\/script>/i.test(html)) {',
              'if (!/<script\\s+type="module"\\s+src="\\.\\/src\\/js\\/app\\.js(?:\\?v=[^\"]+)?"><\\/script>/i.test(html)) {'
          )
          val = val.replace(
              'const target = join(root, match[1]);',
              'const target = join(root, match[1].split("?")[0]);'
          )
          validate.write_text(val, encoding="utf-8")

          static = Path("tests/static.test.js")
          test = static.read_text(encoding="utf-8")
          test = test.replace(
              'assert.match(html, /type="module" src="\\.\\/src\\/js\\/app\\.js"/);',
              'assert.match(html, /type="module" src="\\.\\/src\\/js\\/app\\.js\\?v=[^"]+"/);'
          )
          test = test.replace(
              'assert.match(html, /src="\\.\\/src\\/js\\/zoom-lock\\.js"/);',
              'assert.match(html, /src="\\.\\/src\\/js\\/zoom-lock\\.js\\?v=[^"]+"/);'
          )
          if 'assert.doesNotMatch(zoomLock, /touchend/);' not in test:
              test = test.replace(
                  'assert.match(zoomLock, /dblclick/);',
                  'assert.match(zoomLock, /dblclick/);\n  assert.doesNotMatch(zoomLock, /touchend/);\n  assert.match(responsiveCss, /input:not\\(\\[type="hidden"\\]\\)[\\s\\S]*?font-size:\\s*16px\\s*!important;/i);',
                  1,
              )
          static.write_text(test, encoding="utf-8")

          op = Path("tests/operational-reasons.test.js")
          if op.exists():
              op_text = op.read_text(encoding="utf-8")
              if 'fluxo mantém perguntas explícitas de motivo' not in op_text:
                  op_text += '''\n\ntest("fluxo mantém perguntas explícitas de motivo", () => {\n  assert.match(appSource, /Motivo do ajuste — TNL/);\n  assert.match(appSource, /Escreva o motivo do ajuste para o relatório/);\n  assert.match(appSource, /Motivo da manutenção — TNL/);\n  assert.match(appSource, /Escreva o motivo da manutenção para o relatório/);\n});\n'''
              op.write_text(op_text, encoding="utf-8")
          PY

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar tudo
        run: npm run validate

      - name: Commitar e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-live-runtime-once.yml
          git add -A
          git commit -m "fix: force fresh runtime and stabilize iOS zoom"
          git push
