name: Hard zoom lock once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hard-zoom-lock-once.yml

permissions:
  contents: write

jobs:
  apply:
    name: Bloqueio rígido de zoom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar bloqueio rígido
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          zoom_path = Path('src/js/zoom-lock.js')
          zoom_path.write_text(r'''const preventZoom = (event) => {
            event.preventDefault();
          };

          // iOS Safari exposes native gesture events for pinch zoom.
          ['gesturestart', 'gesturechange', 'gestureend'].forEach((eventName) => {
            document.addEventListener(eventName, preventZoom, { passive: false });
          });

          // Fallback for browsers that do not expose gesture events.
          document.addEventListener(
            'touchmove',
            (event) => {
              if (event.touches && event.touches.length > 1) preventZoom(event);
            },
            { passive: false },
          );

          // Prevent double-click/double-tap zoom while preserving normal single taps.
          document.addEventListener('dblclick', preventZoom, { passive: false });

          let lastTouchEnd = 0;
          document.addEventListener(
            'touchend',
            (event) => {
              const now = Date.now();
              if (now - lastTouchEnd <= 300) preventZoom(event);
              lastTouchEnd = now;
            },
            { passive: false },
          );
          ''', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          app_script = '    <script type="module" src="./src/js/app.js"></script>'
          zoom_script = '    <script type="module" src="./src/js/zoom-lock.js"></script>'
          if zoom_script not in index:
              if app_script not in index:
                  raise SystemExit('Script principal não encontrado no index.html')
              index = index.replace(app_script, zoom_script + '\n' + app_script, 1)
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('styles/base.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('touch-action: pan-x pan-y;', 'touch-action: manipulation;')
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/static.test.js')
          tests = test_path.read_text(encoding='utf-8')
          if 'const zoomLock' not in tests:
              anchor = 'const buildScript = readFileSync(resolve(root, "scripts/build.mjs"), "utf8");'
              replacement = anchor + '\nconst zoomLock = readFileSync(resolve(root, "src/js/zoom-lock.js"), "utf8");'
              if anchor not in tests:
                  raise SystemExit('Âncora dos testes não encontrada')
              tests = tests.replace(anchor, replacement, 1)
          old_assert = 'assert.match(baseCss, /touch-action:\\s*pan-x pan-y;/i);'
          new_assert = 'assert.match(baseCss, /touch-action:\\s*manipulation;/i);\n  assert.match(html, /src="\\.\\/src\\/js\\/zoom-lock\\.js"/);\n  assert.match(zoomLock, /gesturestart/);\n  assert.match(zoomLock, /touches\\.length > 1/);\n  assert.match(zoomLock, /dblclick/);'
          if old_assert in tests:
              tests = tests.replace(old_assert, new_assert, 1)
          elif 'assert.match(zoomLock, /gesturestart/);' not in tests:
              raise SystemExit('Asserção antiga de touch-action não encontrada')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar aplicação
        run: npm test

      - name: Commit da alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles/base.css src/js/zoom-lock.js tests/static.test.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "fix: hard-block pinch and double-tap zoom"
          git push
